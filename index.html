<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Navratri 🌺</title>
<style>
  :root { --wine:#8f2335; --rose:#c34c63; --cream:#fff7eb; --gold:#d9a441; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    background: radial-gradient(circle at top, #ffe9d6, var(--cream) 55%, #f9dce0);
    color:var(--wine); font-family: Georgia, 'Times New Roman', serif; text-align:center;
    overflow:hidden;
  }
  .card {
    width:min(100%, 520px); padding:38px 25px 32px; border:1px solid #e8c98f;
    border-radius:28px; background:rgba(255,255,255,.74);
    box-shadow:0 16px 50px rgba(143,35,53,.12); position:relative;
  }
  .flowers { font-size:34px; letter-spacing:8px; margin-bottom:18px; }
  h1 { font-size:clamp(2rem, 8vw, 3.2rem); line-height:1.08; margin:0 0 14px; }
  h2 { font-size:clamp(1.35rem, 5vw, 2rem); margin:0; color:var(--rose); }
  .line { width:90px; height:2px; background:var(--gold); margin:25px auto 20px; }
  .small { font-family:Arial, sans-serif; font-size:13px; font-weight:600; line-height:1.5; color:#76535a; margin:0; }
  .bottom { margin-top:25px; font-size:12px; color:#a17b61; letter-spacing:2px; text-transform:uppercase; }
  .sparkle { position:absolute; color:#d9a441; font-size:22px; }
  .one { top:18px; left:20px; } .two { top:18px; right:20px; }
  @media (prefers-reduced-motion:no-preference) {
    .flowers { animation: floaty 3s ease-in-out infinite; }
    @keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
  }
</style>
</head>
<body>
  <main class="card">
    <span class="sparkle one">✦</span><span class="sparkle two">✦</span>
    <div class="flowers">🌺 🪔 🌼</div>
    <h1>Haha, just kidding! 😂</h1>
    <h2>Happy Navratri 🙏</h2>
    <div class="line"></div>
    <p class="small">Actually planning to give shagun? DM for QR (no CAP)</p>
    <div class="bottom">Shubh Navratri</div>
  </main>
</body>
</html>
